version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns:
          - "*"
        # Major bumps get their own individual PR instead of riding along in the
        # weekly group — a major (e.g. typescript 6→7) can break peer-dependency
        # resolution for the whole group (npm install fails outright), taking every
        # harmless minor/patch bump down with it. See PR #452.
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # The visual-kit image the screenshots and visual checks render in (visual/Dockerfile).
  # Pinned to an exact release on purpose: the renderer is part of the baselines, so a
  # bump is a reviewed PR; on one, also re-read the Makefile's REPEAT_OK, which mirrors
  # the launcher's accepted range.
  - package-ecosystem: "docker"
    directory: "/visual"
    schedule:
      interval: "weekly"
