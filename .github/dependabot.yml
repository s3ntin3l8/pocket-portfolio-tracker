version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns:
          - "*"
        # Major bumps get their own individual PR instead of riding along in the
        # weekly group — a major (e.g. typescript 6→7) can break peer-dependency
        # resolution for the whole group (npm install fails outright), taking every
        # harmless minor/patch bump down with it. See PR #452.
        update-types:
          - "minor"
          - "patch"
    ignore:
      # jsdom 30.1.x breaks the web tests: dropdown menu items never render
      # after the trigger click (18 failures across 5 test files under
      # jsdom 30.1.0 with everything else unchanged), which takes the whole
      # npm-deps group PR down with it. Drop this once a fixed release is
      # verified against `npm test --workspace @portfolio/web`.
      - dependency-name: "jsdom"
        versions: ["30.1.x"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
